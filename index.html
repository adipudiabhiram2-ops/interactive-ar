
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; }
    button {
      position: fixed;
      z-index: 10;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 25px;
      background: black;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
    }
  </style>
</head>

<body>

<button onclick="changeColor()">CHANGE COLOR</button>

<a-scene
  mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/examples/image-tracking/assets/card-example/card.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera position="0 0 0"
    look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-sphere
      id="orb"
      position="0 0 0.3"
      radius="0.25"
      color="#00FFFF"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
    </a-sphere>

    <a-text
      value="WELCOME TO AR!"
      position="-0.5 0.6 0"
      color="yellow"
      width="2">
    </a-text>

  </a-entity>
</a-scene>

<script>
function changeColor() {
  const colors = ["red", "blue", "lime", "yellow", "magenta"];
  const randomColor = colors[Math.floor(Math.random() * colors.length)];
  document.querySelector("#orb").setAttribute("color", randomColor);
}
</script>

</body>
</html>
